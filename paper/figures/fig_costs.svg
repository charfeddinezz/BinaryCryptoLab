<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
<rect width="760" height="470" fill="#ffffff"/>
<text x="380.0" y="32.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1b1b1b">Cost of every relevant attack, in log2 operations</text>
<line x1="250.0" y1="50.0" x2="250.0" y2="430.0" stroke="#333" stroke-width="1.2"/>
<line x1="250.0" y1="50.0" x2="250.0" y2="430.0" stroke="#dddddd" stroke-width="0.6"/>
<text x="250.0" y="448.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b">2^0</text>
<line x1="349.3" y1="50.0" x2="349.3" y2="430.0" stroke="#dddddd" stroke-width="0.6"/>
<text x="349.3" y="448.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b">2^64</text>
<line x1="448.6" y1="50.0" x2="448.6" y2="430.0" stroke="#dddddd" stroke-width="0.6"/>
<text x="448.6" y="448.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b">2^128</text>
<line x1="547.9" y1="50.0" x2="547.9" y2="430.0" stroke="#dddddd" stroke-width="0.6"/>
<text x="547.9" y="448.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b">2^192</text>
<line x1="647.2" y1="50.0" x2="647.2" y2="430.0" stroke="#dddddd" stroke-width="0.6"/>
<text x="647.2" y="448.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1b1b1b">2^256</text>
<text x="238.0" y="81.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">exhaustive search</text>
<rect x="250.0" y="60.0" width="397.2" height="30.0" fill="#95a5a6"/>
<text x="655.2" y="81.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^256.0</text>
<text x="238.0" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">direct address attack (HASH160 preimage)</text>
<rect x="250.0" y="104.0" width="248.3" height="30.0" fill="#8e44ad"/>
<text x="506.3" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^160.0</text>
<text x="238.0" y="169.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">address chain, sum of stage exponents</text>
<rect x="250.0" y="148.0" width="446.9" height="30.0" fill="#d2b4de"/>
<text x="704.9" y="169.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^288.0</text>
<text x="238.0" y="213.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">Pollard rho (ECDLP)</text>
<rect x="250.0" y="192.0" width="199.1" height="30.0" fill="#c0392b"/>
<text x="457.1" y="213.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^128.3</text>
<text x="238.0" y="257.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">BSGS memory</text>
<rect x="250.0" y="236.0" width="198.6" height="30.0" fill="#e67e22"/>
<text x="456.6" y="257.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^128.0</text>
<text x="238.0" y="301.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">GLV-accelerated rho</text>
<rect x="250.0" y="280.0" width="197.5" height="30.0" fill="#d35400"/>
<text x="455.5" y="301.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^127.3</text>
<text x="238.0" y="345.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">Grover on the HASH160 step</text>
<rect x="250.0" y="324.0" width="124.1" height="30.0" fill="#2980b9"/>
<text x="382.1" y="345.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^80.0</text>
<text x="238.0" y="389.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1b1b1b">finite-field DLP, 256-bit F_p</text>
<rect x="250.0" y="368.0" width="72.4" height="30.0" fill="#16a085"/>
<text x="330.4" y="389.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">2^46.7</text>
<text x="250.0" y="430.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">log2 of the operations needed; lower is weaker</text>
<text x="250.0" y="448.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1b1b1b">stage exponents add up but attack costs do not: the address barrier is the preimage step</text>
</svg>
