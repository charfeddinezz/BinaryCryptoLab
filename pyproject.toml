[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "binarycryptolab"
dynamic = ["version"]
description = "Local toolkit for binary/hex analysis, secp256k1 public-key derivation, and Bitcoin address encoding."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BinaryCryptoLab contributors" }]
keywords = ["binary", "hexadecimal", "bitcoin", "secp256k1", "cryptography", "education"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = ["cryptography>=42,<52"]

[project.optional-dependencies]
gui = ["streamlit>=1.50,<2"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]
all = ["streamlit>=1.50,<2"]

[project.urls]
Homepage = "https://github.com/charfeddinezz/BinaryCryptoLab"
Documentation = "https://github.com/charfeddinezz/BinaryCryptoLab/blob/main/docs/usage.md"
Issues = "https://github.com/charfeddinezz/BinaryCryptoLab/issues"

[project.scripts]
binarycryptolab = "binarycryptolab.cli:main"
binarycryptolab-gui = "binarycryptolab.gui.launcher:main"

[tool.hatch.version]
path = "src/binarycryptolab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/binarycryptolab"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "requirements.txt",
  "Makefile",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "DTZ", "T20"]
ignore = ["E501"]  # line length is enforced by the formatter where practical

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"examples/*" = ["T20"]
"src/binarycryptolab/cli.py" = ["T20"]  # the CLI is the user-facing text interface
"src/binarycryptolab/gui/*" = ["T20"]  # Streamlit renders through the UI, not stdout

[tool.ruff.lint.isort]
known-first-party = ["binarycryptolab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning"]
markers = ["network: tests that would require network access (none by default)"]

[tool.coverage.run]
source = ["binarycryptolab"]
branch = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["binarycryptolab"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
pretty = true
